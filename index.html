<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay</title>
    <style>
        /* ── reset & base ── */
        :root {
            --bg: #1e1e1e;
            --panel: #252525;
            --panel-hd: #1a1a1a;
            --border: #3a3a3a;
            --text: #bababa;
            --bright: #d4d4d4;
            --muted: #5e5e5e;
            --sel: #1f5c8a;
            --sel-b: #2d7fc1;
            --hover: #333;
            --btn: #2d2d2d;
            --btn-hov: #3d3d3d;
            --live: #cc2a2a;
            --ready: #3a7a3a;
            --ff: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --mono: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--ff);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ── menubar ── */
        #menubar {
            height: 28px;
            background: #161616;
            border-bottom: 1px solid #111;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 2px;
            flex-shrink: 0;
            user-select: none;
        }
        .brand {
            font-size: 13px;
            font-weight: 700;
            color: var(--bright);
            display: flex;
            align-items: center;
            gap: 5px;
            margin-right: 10px;
        }
        .brand-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--live);
            opacity: .25;
            transition: opacity .3s;
        }
        .brand-dot.live {
            opacity: 1;
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1
            }
            50% {
                opacity: .35
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .brand-dot.live {
                animation: none;
            }
        }
        .mitem {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            color: var(--text);
        }
        .mitem:hover {
            background: var(--hover);
        }

        /* ── main ── */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* ── preview ── */
        #preview-area {
            flex: 1;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            min-height: 0;
            position: relative;
        }
        #canvas-wrap {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: 100%;
        }
        #preview {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 28px - 210px - 22px - 20px);
            border: 1px solid #2a2a2a;
            background: #000;
            cursor: default;
        }
        #preview.can-drag {
            cursor: grab;
        }
        #preview.dragging {
            cursor: grabbing;
        }
        #pbadge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0, 0, 0, .65);
            color: var(--muted);
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 2px;
            pointer-events: none;
        }
        #livebadge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--live);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .05em;
            padding: 2px 8px;
            border-radius: 2px;
            display: none;
            pointer-events: none;
        }

        /* ── dock ── */
        #dock {
            height: 210px;
            border-top: 1px solid #111;
            display: flex;
            flex-shrink: 0;
            gap: 0;
        }
        .dp {
            display: flex;
            flex-direction: column;
            border-right: 1px solid #111;
            min-width: 0;
            flex: 1 1 0;
        }
        .dp:last-child {
            border-right: none;
            flex: 1.4 1 0;
        }
        .dp-hd {
            background: var(--panel-hd);
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .05em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dp-hd .addbtn {
            font-size: 15px;
            line-height: 1;
            color: var(--muted);
            cursor: pointer;
            padding: 0 4px;
        }
        .dp-hd .addbtn:hover {
            color: var(--bright);
        }
        .dp-body {
            flex: 1;
            overflow-y: auto;
            background: var(--panel);
            scrollbar-width: thin;
            scrollbar-color: #444 transparent;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        #pScenes {
            flex: 0.8 1 0;
            min-width: 100px;
        }
        #pSources {
            flex: 1.1 1 0;
            min-width: 140px;
        }
        #pAudio {
            flex: 0.9 1 0;
            min-width: 130px;
        }
        #pSound {
            flex: 0.9 1 0;
            min-width: 130px;
        }
        #pControls {
            flex: 1.4 1 0;
            min-width: 160px;
        }

        /* ── scenes ── */
        .sc-row {
            padding: 6px 9px;
            border-bottom: 1px solid rgba(255, 255, 255, .03);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .sc-row:hover {
            background: var(--hover);
        }
        .sc-row.active {
            background: var(--sel);
            color: var(--bright);
        }
        .sc-pip {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
        }
        .sc-row.active .sc-pip {
            background: #7dc5f2;
        }
        .sc-name {
            font-size: 12px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── sources ── */
        .src-row {
            padding: 5px 9px;
            border-bottom: 1px solid rgba(255, 255, 255, .03);
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }
        .src-row:hover {
            background: var(--hover);
        }
        .src-row.selected {
            background: var(--sel);
        }
        .src-eye {
            font-size: 11px;
            flex-shrink: 0;
            cursor: pointer;
            opacity: .6;
            user-select: none;
        }
        .src-eye:hover {
            opacity: 1;
        }
        .src-name {
            flex: 1;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .src-tag {
            font-size: 10px;
            color: var(--muted);
            flex-shrink: 0;
        }
        .src-empty {
            padding: 10px 9px;
            font-size: 11px;
            color: var(--muted);
        }
        .src-del-row {
            padding: 5px 9px;
        }
        .del-btn {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 3px;
            border: 1px solid var(--live);
            background: transparent;
            color: var(--live);
            cursor: pointer;
            width: 100%;
        }
        .del-btn:hover {
            background: rgba(204, 42, 42, .15);
        }
        .del-btn:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        /* ── audio mixer ── */
        .atrack {
            padding: 8px 9px;
            border-bottom: 1px solid rgba(255, 255, 255, .03);
        }
        .atrack-hd {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
        }
        .atrack-label {
            flex: 1;
            font-size: 12px;
        }
        .mute-btn {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: var(--btn);
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mute-btn:hover {
            background: var(--btn-hov);
        }
        .mute-btn.muted {
            background: var(--live);
            border-color: #a02222;
        }
        .meter-bar {
            height: 5px;
            background: #111;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 3px;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3a7a3a 0%, #7ac93a 72%, #e8b339 88%, #cc2a2a 100%);
            border-radius: 2px;
            transition: width .07s;
        }
        .mic-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
        }
        .mic-row label {
            font-size: 12px;
            cursor: pointer;
            flex: 1;
        }
        .mic-hint {
            font-size: 10px;
            color: var(--muted);
        }

        /* ── sound board ── */
        .snd-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
        }
        .snd-btn {
            flex: 1;
            padding: 4px 6px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: var(--btn);
            color: var(--text);
            font-size: 11px;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .snd-btn:hover {
            background: var(--btn-hov);
        }
        .snd-btn .snd-icon {
            flex-shrink: 0;
        }
        .snd-del {
            font-size: 14px;
            color: var(--muted);
            cursor: pointer;
            padding: 0 4px;
            flex-shrink: 0;
        }
        .snd-del:hover {
            color: var(--live);
        }
        .snd-empty {
            padding: 10px 9px;
            font-size: 11px;
            color: var(--muted);
        }

        /* ── controls ── */
        #ctrls {
            padding: 9px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .key-label {
            font-size: 10px;
            color: var(--muted);
        }
        input#streamKey {
            width: 100%;
            padding: 5px 7px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: #1a1a1a;
            color: var(--text);
            font-size: 12px;
            font-family: var(--mono);
        }
        input#streamKey:focus {
            outline: 2px solid var(--sel-b);
            border-color: transparent;
        }
        .ctrl-link {
            font-size: 10px;
            color: var(--muted);
            line-height: 1.5;
        }
        .ctrl-link a {
            color: #5593c8;
        }

        /* buttons */
        button {
            font-family: var(--ff);
            cursor: pointer;
        }
        .btn {
            width: 100%;
            padding: 6px 10px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: var(--btn);
            color: var(--text);
            font-size: 12px;
            text-align: center;
        }
        .btn:hover:not(:disabled) {
            background: var(--btn-hov);
        }
        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
        .btn-start {
            background: #1f5c8a;
            border-color: #174870;
            color: #fff;
            font-weight: 600;
            padding: 8px;
        }
        .btn-start:hover:not(:disabled) {
            background: #2878b5;
        }
        .btn-stop {
            background: transparent;
            border-color: var(--live);
            color: var(--live);
            font-weight: 600;
            padding: 8px;
            display: none;
        }
        .btn-stop:hover:not(:disabled) {
            background: rgba(204, 42, 42, .1);
        }

        /* ── statusbar ── */
        #statusbar {
            height: 22px;
            background: #161616;
            border-top: 1px solid #111;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 10px;
            font-size: 11px;
            color: var(--muted);
            flex-shrink: 0;
        }
        .sb-seg {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sb-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--muted);
        }
        .sb-dot.live {
            background: var(--live);
        }
        .sb-dot.ready {
            background: var(--ready);
        }
        #sb-timer {
            font-family: var(--mono);
        }

        /* ── modal ── */
        #modal-wrap {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, .72);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #modal-wrap.hidden {
            display: none;
        }
        .modal {
            background: #2a2a2a;
            border: 1px solid var(--border);
            border-radius: 5px;
            width: 380px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-hd {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            color: var(--bright);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: #2a2a2a;
            z-index: 2;
        }
        .modal-x {
            cursor: pointer;
            color: var(--muted);
            font-size: 17px;
            line-height: 1;
        }
        .modal-x:hover {
            color: var(--bright);
        }
        .modal-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-ft {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            position: sticky;
            bottom: 0;
            background: #2a2a2a;
            z-index: 2;
        }
        .frow {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .frow label {
            font-size: 11px;
            color: var(--muted);
        }
        .frow input,
        .frow select {
            padding: 5px 7px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: #1a1a1a;
            color: var(--text);
            font-size: 12px;
            font-family: var(--ff);
        }
        .frow input:focus,
        .frow select:focus {
            outline: 2px solid var(--sel-b);
        }
        .frow input[type="color"] {
            padding: 2px;
            height: 28px;
        }
        .frow input[type="range"] {
            padding: 0;
            height: 22px;
            width: 100%;
            accent-color: var(--sel-b);
        }
        .frow-inline {
            display: flex;
            gap: 8px;
        }
        .frow-inline .frow {
            flex: 1;
        }
        .frow-check {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .frow-check label {
            font-size: 12px;
            color: var(--text);
            cursor: pointer;
        }
        .rg {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .rg label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--text);
            cursor: pointer;
        }
        .mbtn {
            padding: 5px 14px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: var(--btn);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
        }
        .mbtn:hover {
            background: var(--btn-hov);
        }
        .mbtn-ok {
            background: var(--sel);
            border-color: #174870;
            color: #fff;
        }
        .mbtn-ok:hover {
            background: #2878b5;
        }
        .frow .hint {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* small screens */
        @media (max-width: 820px) {
            #dock {
                height: 180px;
                flex-wrap: nowrap;
                overflow-x: auto;
            }
            .dp {
                min-width: 120px !important;
                flex: 0 0 auto !important;
                width: 130px;
            }
            #pControls {
                min-width: 150px !important;
                flex: 0 0 auto !important;
                width: 160px;
            }
            #preview {
                max-height: calc(100vh - 28px - 180px - 22px - 20px);
            }
        }
        @media (max-width: 600px) {
            #dock {
                height: 160px;
            }
            .dp {
                min-width: 100px !important;
                width: 110px;
            }
            #pControls {
                min-width: 130px !important;
                width: 140px;
            }
            #preview {
                max-height: calc(100vh - 28px - 160px - 22px - 16px);
            }
            .modal {
                width: 95vw;
            }
        }
    </style>
</head>
<body>
    <div id="menubar">
        <div class="brand"><span class="brand-dot" id="bDot"></span>Relay</div>
        <span class="mitem">File</span>
        <span class="mitem">View</span>
        <span class="mitem">Help</span>
    </div>

    <div id="main">
        <div id="preview-area">
            <div id="canvas-wrap">
                <canvas id="preview" width="1280" height="720"></canvas>
                <span id="pbadge">No source</span>
                <span id="livebadge">● LIVE</span>
            </div>
        </div>

        <div id="dock">
            <div class="dp" id="pScenes">
                <div class="dp-hd">Scenes<span class="addbtn" id="addSceneBtn">＋</span></div>
                <div class="dp-body" id="scenesBody"></div>
            </div>

            <div class="dp" id="pSources">
                <div class="dp-hd">Sources<span class="addbtn" id="addSrcBtn">＋</span></div>
                <div class="dp-body" id="sourcesBody"></div>
            </div>

            <div class="dp" id="pAudio">
                <div class="dp-hd">Audio Mixer</div>
                <div class="dp-body">
                    <div class="atrack">
                        <div class="atrack-hd">
                            <span class="atrack-label">Desktop</span>
                            <button class="mute-btn" id="deskMuteBtn">🔊</button>
                        </div>
                        <div class="meter-bar"><div class="meter-fill" id="deskMeter"></div></div>
                    </div>
                    <div class="atrack">
                        <div class="mic-row">
                            <label for="micToggle">Mic</label>
                            <input type="checkbox" id="micToggle" style="cursor:pointer" />
                        </div>
                        <div class="meter-bar"><div class="meter-fill" id="micMeter"></div></div>
                        <div class="mic-hint">Check to enable microphone</div>
                    </div>
                </div>
            </div>

            <div class="dp" id="pSound">
                <div class="dp-hd">Sound Board<span class="addbtn" id="addSoundBtn">＋</span></div>
                <div class="dp-body" id="soundBody"></div>
            </div>

            <div class="dp" id="pControls">
                <div class="dp-hd">Controls</div>
                <div class="dp-body">
                    <div id="ctrls">
                        <button class="btn" id="shareBtn">📡 Capture Screen</button>
                        <div>
                            <div class="key-label" style="margin-bottom:3px">Twitch Stream Key</div>
                            <input type="password" id="streamKey" placeholder="live_xxxxxxxxxxxxxxxx" autocomplete="off" />
                        </div>
                        <button class="btn btn-start" id="goLiveBtn" disabled>▶ Start Streaming</button>
                        <button class="btn btn-stop" id="stopBtn">■ Stop Streaming</button>
                        <div class="ctrl-link">
                            Get your key from the <a href="https://dashboard.twitch.tv/settings/stream" target="_blank" rel="noopener">Twitch dashboard</a> under Settings → Stream.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="statusbar">
        <div class="sb-seg">
            <span class="sb-dot" id="sbDot"></span>
            <span id="sbText">Idle</span>
        </div>
        <div class="sb-seg" id="sbTimerSeg" style="display:none">
            <span>Live:</span>
            <span id="sb-timer">00:00:00</span>
        </div>
    </div>

    <div id="modal-wrap" class="hidden">
        <div class="modal">
            <div class="modal-hd">
                <span id="modalTitle">Add Source</span>
                <span class="modal-x" id="modalX">×</span>
            </div>
            <div class="modal-body">
                <div class="frow">
                    <label>Type</label>
                    <div class="rg">
                        <label><input type="radio" name="ovType" value="text" checked /> Text</label>
                        <label><input type="radio" name="ovType" value="image" /> Image</label>
                        <label><input type="radio" name="ovType" value="camera" /> Camera</label>
                    </div>
                </div>

                <div id="txtFields">
                    <div class="frow" style="margin-bottom:8px">
                        <label>Text</label>
                        <input type="text" id="ovText" placeholder="Your text here…" />
                    </div>
                    <div class="frow-inline">
                        <div class="frow"><label>Font size</label><input type="number" id="ovSize" value="36" min="8" max="300" /></div>
                        <div class="frow"><label>Color</label><input type="color" id="ovColor" value="#ffffff" /></div>
                    </div>
                    <div class="frow-inline" style="margin-top:8px;align-items:center">
                        <div class="frow-check"><input type="checkbox" id="ovBgOn" /><label for="ovBgOn">Background color</label></div>
                        <div class="frow"><input type="color" id="ovBgColor" value="#000000" /></div>
                    </div>
                </div>

                <div id="imgFields" style="display:none">
                    <div class="frow">
                        <label>Image file (PNG, JPG, GIF, WebP…)</label>
                        <input type="file" id="ovFile" accept="image/*" style="color:var(--text)" />
                    </div>
                    <div class="frow" style="margin-top:8px">
                        <label>Width on stream (% of frame width)</label>
                        <input type="number" id="ovImgW" value="25" min="1" max="100" />
                    </div>
                </div>

                <div id="camFields" style="display:none">
                    <div class="frow">
                        <label>Camera device</label>
                        <select id="ovCamDev"></select>
                    </div>
                    <div class="frow" style="margin-top:6px">
                        <label>Width on stream (% of frame width)</label>
                        <input type="number" id="ovCamW" value="18" min="5" max="60" />
                    </div>
                    <div class="frow" style="margin-top:4px">
                        <label>Mirror horizontally</label>
                        <div class="frow-check"><input type="checkbox" id="ovCamMirror" checked /><label for="ovCamMirror">Mirror</label></div>
                    </div>
                </div>

                <div class="frow-inline">
                    <div class="frow"><label>X position (%)</label><input type="number" id="ovX" value="5" min="0" max="100" /></div>
                    <div class="frow"><label>Y position (%)</label><input type="number" id="ovY" value="90" min="0" max="100" /></div>
                </div>
                <div class="frow">
                    <label>Opacity — <span id="opPct">100</span>%</label>
                    <input type="range" id="ovOpacity" min="0" max="100" value="100" />
                </div>
            </div>
            <div class="modal-ft">
                <button class="mbtn" id="modalCancel">Cancel</button>
                <button class="mbtn mbtn-ok" id="modalSave">Add</button>
            </div>
        </div>
    </div>

    <script>
        const WHIP = 'https://g.webrtc.live-video.net:4443/v2/offer';
        const CW = 1280, CH = 720;

        const $ = id => document.getElementById(id);
        const canvas = $('preview');
        const ctx = canvas.getContext('2d');
        const vidEl = document.createElement('video');
        vidEl.autoplay = true;
        vidEl.muted = true;
        vidEl.playsInline = true;

        let scenes = [{ id: 1, name: 'Scene 1' }, { id: 2, name: 'Scene 2' }];
        let activeId = 1, nextSId = 3;
        let overlays = { 1: [], 2: [] };
        let nextOId = 1, selOvId = null, editOvId = null;

        let displayStream = null, micStream = null;
        let pc = null, whipRes = null;
        let startTime = null, timerIv = null;
        let deskMuted = false;
        let drag = null;

        let audioCtx = null;
        let audioDest = null;
        let audioConnections = [];
        let soundBuffers = {};
        let nextSoundId = 1;
        let sounds = [];
        let camStreams = {};

        let meterStops = {};

        function setStatus(state, txt) {
            $('sbDot').className = 'sb-dot' + (state ? ' ' + state : '');
            $('sbText').textContent = txt;
        }

        function activeOvs() {
            return overlays[activeId] || [];
        }

        function ensureAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                audioDest = audioCtx.createMediaStreamDestination();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return audioCtx;
        }

        function connectTrackToStream(track, type) {
            if (!track) return null;
            ensureAudio();
            try {
                const src = audioCtx.createMediaStreamSource(new MediaStream([track]));
                const gain = audioCtx.createGain();
                gain.gain.value = 1;
                src.connect(gain);
                gain.connect(audioDest);
                const conn = { type, track, source: src, gain };
                audioConnections.push(conn);
                return conn;
            } catch (e) {
                console.warn('connectTrackToStream error:', e);
                return null;
            }
        }

        function playSoundBuffer(buffer, volume) {
            if (!audioCtx || audioCtx.state === 'closed') return;
            try {
                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.value = volume || 1;
                src.connect(gain);
                gain.connect(audioDest);
                gain.connect(audioCtx.destination);
                src.start();
                src.onended = () => {
                    try { src.disconnect(); } catch (_) {}
                    try { gain.disconnect(); } catch (_) {}
                };
            } catch (e) {
                console.warn('playSoundBuffer error:', e);
            }
        }

        function disconnectAllAudio() {
            audioConnections.forEach(c => {
                try { c.source.disconnect(); } catch (_) {}
                try { c.gain?.disconnect(); } catch (_) {}
            });
            audioConnections = [];
            if (audioCtx && audioCtx.state !== 'closed') {
                try { audioCtx.close(); } catch (_) {}
            }
            audioCtx = null;
            audioDest = null;
        }

        function renderScenes() {
            const body = $('scenesBody');
            body.innerHTML = '';
            scenes.forEach(s => {
                const el = document.createElement('div');
                el.className = 'sc-row' + (s.id === activeId ? ' active' : '');
                const pip = document.createElement('span');
                pip.className = 'sc-pip';
                const name = document.createElement('span');
                name.className = 'sc-name';
                name.textContent = s.name;
                el.append(pip, name);
                el.onclick = () => {
                    activeId = s.id;
                    selOvId = null;
                    renderScenes();
                    renderSources();
                };
                body.appendChild(el);
            });
        }

        $('addSceneBtn').onclick = () => {
            const name = prompt('Scene name:', 'Scene ' + nextSId);
            if (!name) return;
            const id = nextSId++;
            scenes.push({ id, name });
            overlays[id] = [];
            renderScenes();
        };

        function renderSources() {
            const body = $('sourcesBody');
            body.innerHTML = '';
            const list = activeOvs();
            if (!list.length) {
                const e = document.createElement('div');
                e.className = 'src-empty';
                e.textContent = 'No overlays. Click + to add one.';
                body.appendChild(e);
                return;
            }
            list.forEach(ov => {
                const el = document.createElement('div');
                el.className = 'src-row' + (ov.id === selOvId ? ' selected' : '');

                const eye = document.createElement('span');
                eye.className = 'src-eye';
                eye.textContent = ov.visible ? '👁' : '🚫';
                eye.onclick = e => {
                    e.stopPropagation();
                    ov.visible = !ov.visible;
                    renderSources();
                };

                const name = document.createElement('span');
                name.className = 'src-name';
                name.textContent = ov.label;

                const tag = document.createElement('span');
                tag.className = 'src-tag';
                tag.textContent = ov.type === 'text' ? 'T' : ov.type === 'camera' ? '📷' : '🖼';

                el.append(eye, name, tag);
                el.onclick = () => {
                    selOvId = ov.id;
                    renderSources();
                };
                el.ondblclick = () => openEdit(ov);
                body.appendChild(el);
            });

            const row = document.createElement('div');
            row.className = 'src-del-row';
            const btn = document.createElement('button');
            btn.className = 'del-btn';
            btn.textContent = '− Remove selected';
            btn.disabled = !selOvId;
            btn.onclick = () => {
                if (!selOvId) return;
                const ov = overlays[activeId].find(o => o.id === selOvId);
                if (ov && ov.type === 'camera') stopCamera(ov.id);
                overlays[activeId] = overlays[activeId].filter(o => o.id !== selOvId);
                selOvId = null;
                renderSources();
            };
            row.appendChild(btn);
            body.appendChild(row);
        }

        function stopCamera(ovId) {
            if (camStreams[ovId]) {
                camStreams[ovId].getTracks().forEach(t => t.stop());
                delete camStreams[ovId];
            }
            Object.values(overlays).forEach(list => {
                const ov = list.find(o => o.id === ovId);
                if (ov && ov.vidEl) {
                    try {
                        ov.vidEl.srcObject = null;
                        ov.vidEl.remove();
                    } catch (_) {}
                    delete ov.vidEl;
                }
            });
        }

        function frame() {
            requestAnimationFrame(frame);

            if (displayStream && vidEl.readyState >= 2) {
                const sw = vidEl.videoWidth || CW;
                const sh = vidEl.videoHeight || CH;
                const scale = Math.min(CW / sw, CH / sh);
                const dw = sw * scale;
                const dh = sh * scale;
                const dx = (CW - dw) / 2;
                const dy = (CH - dh) / 2;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, CW, CH);
                ctx.drawImage(vidEl, dx, dy, dw, dh);
            } else {
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, CW, CH);
                ctx.fillStyle = '#2a2a2a';
                ctx.font = '22px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No source — click Capture Screen in Controls', CW / 2, CH / 2);
                ctx.textAlign = 'left';
            }

            activeOvs().forEach(ov => {
                if (!ov.visible) return;
                const x = ov.xPct / 100 * CW;
                const y = ov.yPct / 100 * CH;

                ctx.save();
                ctx.globalAlpha = ov.opacity;

                if (ov.type === 'text') {
                    const fs = ov.fontSize || 36;
                    ctx.font = `bold ${fs}px sans-serif`;
                    const tw = ctx.measureText(ov.text || '').width;
                    const pad = 6;

                    if (ov.bgOn) {
                        ctx.fillStyle = ov.bgColor || '#000';
                        ctx.fillRect(x - pad, y - fs - pad * .5, tw + pad * 2, fs + pad * 1.5);
                    }

                    ctx.fillStyle = ov.color || '#fff';
                    ctx.fillText(ov.text || '', x, y);
                } else if (ov.type === 'image' && ov.img) {
                    const scale = ((ov.widthPct || 25) / 100 * CW) / ov.img.naturalWidth;
                    const iw = ov.img.naturalWidth * scale;
                    const ih = ov.img.naturalHeight * scale;
                    ctx.drawImage(ov.img, x, y - ih, iw, ih);
                } else if (ov.type === 'camera' && ov.vidEl && ov.vidEl.readyState >= 2) {
                    const w = (ov.widthPct || 18) / 100 * CW;
                    const ar = ov.vidEl.videoWidth / ov.vidEl.videoHeight || 4 / 3;
                    const h = w / ar;

                    if (ov.mirror) {
                        ctx.save();
                        ctx.translate(x + w / 2, y - h / 2);
                        ctx.scale(-1, 1);
                        ctx.drawImage(ov.vidEl, -w / 2, -h / 2, w, h);
                        ctx.restore();
                    } else {
                        ctx.drawImage(ov.vidEl, x, y - h, w, h);
                    }
                }

                if (ov.id === selOvId) {
                    ctx.globalAlpha = .75;
                    ctx.strokeStyle = '#2d7fc1';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 3]);

                    let aw = 60, ah = 40;

                    if (ov.type === 'text') {
                        const fs = ov.fontSize || 36;
                        ctx.font = `bold ${fs}px sans-serif`;
                        aw = ctx.measureText(ov.text || '').width + 12;
                        ah = fs + 10;
                    } else if (ov.type === 'camera') {
                        const w = (ov.widthPct || 18) / 100 * CW;
                        aw = w + 8;
                        ah = w / (ov.vidEl?.videoWidth / ov.vidEl?.videoHeight || 4 / 3) + 8;
                    } else if (ov.type === 'image' && ov.img) {
                        const scale = ((ov.widthPct || 25) / 100 * CW) / ov.img.naturalWidth;
                        aw = ov.img.naturalWidth * scale + 8;
                        ah = ov.img.naturalHeight * scale + 8;
                    }

                    ctx.strokeRect(x - 4, y - ah - 2, aw + 8, ah + 6);
                    ctx.setLineDash([]);
                }

                ctx.restore();
            });
        }
        frame();

        function toCanvas(e) {
            const r = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - r.left) / r.width * CW,
                y: (e.clientY - r.top) / r.height * CH
            };
        }

        function hitOv(cx, cy) {
            const list = activeOvs();

            for (let i = list.length - 1; i >= 0; i--) {
                const ov = list[i];
                if (!ov.visible) continue;

                const ox = ov.xPct / 100 * CW;
                const oy = ov.yPct / 100 * CH;
                let top, right;

                if (ov.type === 'text') {
                    const fs = ov.fontSize || 36;
                    ctx.font = `bold ${fs}px sans-serif`;
                    top = oy - fs - 6;
                    right = ox + ctx.measureText(ov.text || '').width + 6;
                } else if (ov.type === 'camera') {
                    const w = (ov.widthPct || 18) / 100 * CW;
                    const ar = ov.vidEl?.videoWidth / ov.vidEl?.videoHeight || 4 / 3;
                    const h = w / ar;
                    top = oy - h - 4;
                    right = ox + w + 4;
                } else if (ov.type === 'image' && ov.img) {
                    const scale = ((ov.widthPct || 25) / 100 * CW) / ov.img.naturalWidth;
                    const w = ov.img.naturalWidth * scale;
                    const h = ov.img.naturalHeight * scale;
                    top = oy - h - 4;
                    right = ox + w + 4;
                } else {
                    continue;
                }

                if (cx >= ox - 4 && cx <= right && cy >= top && cy <= oy + 8) return ov;
            }

            return null;
        }

        canvas.onmousedown = e => {
            const { x, y } = toCanvas(e);
            const ov = hitOv(x, y);

            if (ov) {
                drag = { ovId: ov.id, sx: x, sy: y, ox: ov.xPct, oy: ov.yPct };
                canvas.classList.add('dragging');
                selOvId = ov.id;
                renderSources();
                e.preventDefault();
            }
        };

        canvas.onmousemove = e => {
            const { x, y } = toCanvas(e);

            if (drag) {
                const ov = activeOvs().find(o => o.id === drag.ovId);
                if (ov) {
                    ov.xPct = Math.max(0, Math.min(100, drag.ox + (x - drag.sx) / CW * 100));
                    ov.yPct = Math.max(0, Math.min(100, drag.oy + (y - drag.sy) / CH * 100));
                }
            } else {
                canvas.classList.toggle('can-drag', !!hitOv(x, y));
            }
        };

        canvas.onmouseup = canvas.onmouseleave = () => {
            drag = null;
            canvas.classList.remove('dragging');
        };

        function startMeter(key, track, fillEl) {
            meterStops[key]?.();

            const ac = new(window.AudioContext || window.webkitAudioContext)();
            const src = ac.createMediaStreamSource(new MediaStream([track]));
            const an = ac.createAnalyser();
            an.fftSize = 256;
            src.connect(an);

            const data = new Uint8Array(an.frequencyBinCount);
            let alive = true;

            meterStops[key] = () => {
                alive = false;
                fillEl.style.width = '0%';
                try { src.disconnect(); } catch (_) {}
                try { an.disconnect(); } catch (_) {}
                try { ac.close(); } catch (_) {}
            };

            (function tick() {
                if (!alive) return;
                requestAnimationFrame(tick);
                an.getByteFrequencyData(data);
                const avg = data.reduce((a, b) => a + b, 0) / data.length;
                fillEl.style.width = Math.min(100, avg / 255 * 210) + '%';
            })();
        }

        $('shareBtn').onclick = async () => {
            try {
                displayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 30 },
                    audio: true
                });

                vidEl.srcObject = displayStream;
                await vidEl.play().catch(() => {});

                $('pbadge').textContent = 'Preview';
                $('goLiveBtn').disabled = false;
                $('shareBtn').disabled = true;
                setStatus('ready', 'Source active');

                const at = displayStream.getAudioTracks();
                if (at.length) startMeter('desk', at[0], $('deskMeter'));

                displayStream.getVideoTracks()[0].addEventListener('ended', stopAll);
            } catch {
                setStatus('', 'Capture cancelled');
            }
        };

        $('deskMuteBtn').onclick = () => {
            deskMuted = !deskMuted;
            displayStream?.getAudioTracks().forEach(t => t.enabled = !deskMuted);
            $('deskMuteBtn').textContent = deskMuted ? '🔇' : '🔊';
            $('deskMuteBtn').classList.toggle('muted', deskMuted);
        };

        $('micToggle').onchange = async function() {
            if (this.checked) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const track = micStream.getAudioTracks()[0];
                    startMeter('mic', track, $('micMeter'));

                    if (audioCtx && audioCtx.state !== 'closed') {
                        connectTrackToStream(track, 'mic');
                    }
                } catch {
                    this.checked = false;
                    alert('Could not access microphone.');
                }
            } else {
                micStream?.getTracks().forEach(t => t.stop());
                micStream = null;
                meterStops.mic?.();
                delete meterStops.mic;

                audioConnections.filter(c => c.type === 'mic').forEach(c => {
                    try { c.source.disconnect(); } catch (_) {}
                    try { c.gain?.disconnect(); } catch (_) {}
                });
                audioConnections = audioConnections.filter(c => c.type !== 'mic');
            }
        };

        function renderSounds() {
            const body = $('soundBody');
            body.innerHTML = '';

            if (!sounds.length) {
                const e = document.createElement('div');
                e.className = 'snd-empty';
                e.textContent = 'No sounds. Click + to upload.';
                body.appendChild(e);
                return;
            }

            sounds.forEach(s => {
                const row = document.createElement('div');
                row.className = 'snd-row';

                const btn = document.createElement('button');
                btn.className = 'snd-btn';

                const icon = document.createElement('span');
                icon.className = 'snd-icon';
                icon.textContent = '🔊';

                const label = document.createElement('span');
                label.textContent = s.name;

                btn.append(icon, label);
                btn.onclick = () => {
                    if (soundBuffers[s.id]) {
                        playSoundBuffer(soundBuffers[s.id], 0.8);
                    } else {
                        loadSoundFile(s.id);
                    }
                };

                const del = document.createElement('span');
                del.className = 'snd-del';
                del.textContent = '✕';
                del.onclick = () => {
                    sounds = sounds.filter(x => x.id !== s.id);
                    delete soundBuffers[s.id];
                    renderSounds();
                };

                row.append(btn, del);
                body.appendChild(row);
            });
        }

        async function loadSoundFile(id) {
            const s = sounds.find(x => x.id === id);
            if (!s || !s.file) return;

            try {
                const buf = await s.file.arrayBuffer();
                ensureAudio();
                const decoded = await audioCtx.decodeAudioData(buf);
                soundBuffers[id] = decoded;
            } catch (e) {
                console.warn('Could not decode sound:', e);
            }
        }

        $('addSoundBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'audio/*';

            input.onchange = () => {
                const f = input.files[0];
                if (!f) return;

                const id = nextSoundId++;
                const name = f.name.replace(/\.[^.]+$/, '').slice(0, 24);

                sounds.push({ id, name, file: f });
                loadSoundFile(id);
                renderSounds();
            };

            input.click();
        };

        async function getCameraDevices() {
            try {
                const devs = await navigator.mediaDevices.enumerateDevices();
                return devs.filter(d => d.kind === 'videoinput');
            } catch {
                return [];
            }
        }

        function populateCamSelect() {
            const sel = $('ovCamDev');
            sel.innerHTML = '<option value="">— default —</option>';

            getCameraDevices().then(devs => {
                devs.forEach((d, i) => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    opt.textContent = d.label || `Camera ${i + 1}`;
                    sel.appendChild(opt);
                });
            });
        }

        async function startCamera(deviceId) {
            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    frameRate: { ideal: 30 }
                }
            };

            if (deviceId) constraints.video.deviceId = { exact: deviceId };

            try {
                return await navigator.mediaDevices.getUserMedia(constraints);
            } catch (e) {
                console.warn('Camera error:', e);
                return null;
            }
        }

        function preferH264(peer) {
            try {
                const tr = peer.getTransceivers().find(t => t.sender.track?.kind === 'video');
                if (!tr?.setCodecPreferences) return;

                const caps = RTCRtpSender.getCapabilities('video');
                const h264 = caps.codecs.filter(c => c.mimeType === 'video/H264');

                if (h264.length) tr.setCodecPreferences(h264);
            } catch {}
        }

        function iceReady(peer) {
            if (peer.iceGatheringState === 'complete') return Promise.resolve();

            return new Promise(resolve => {
                const check = () => {
                    if (peer.iceGatheringState === 'complete') {
                        peer.removeEventListener('icegatheringstatechange', check);
                        resolve();
                    }
                };

                peer.addEventListener('icegatheringstatechange', check);
                setTimeout(resolve, 4000);
            });
        }

        $('goLiveBtn').onclick = async () => {
            const key = $('streamKey').value.trim();

            if (!key) {
                setStatus('', 'Enter stream key first');
                return;
            }

            $('goLiveBtn').disabled = true;
            setStatus('', 'Connecting to Twitch…');

            try {
                const canvasStream = canvas.captureStream(30);
                ensureAudio();

                const deskTrack = displayStream?.getAudioTracks()[0] ?? null;
                if (deskTrack) connectTrackToStream(deskTrack, 'desk');

                if (micStream) {
                    const micTrack = micStream.getAudioTracks()[0];
                    if (micTrack) connectTrackToStream(micTrack, 'mic');
                }

                const audioTrack = audioDest?.stream.getAudioTracks()[0] ?? null;

                pc = new RTCPeerConnection();
                pc.addTrack(canvasStream.getVideoTracks()[0], canvasStream);

                if (audioTrack) pc.addTrack(audioTrack, canvasStream);

                preferH264(pc);

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await iceReady(pc);

                const res = await fetch(WHIP, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/sdp',
                        'Authorization': `Bearer ${key}`
                    },
                    body: pc.localDescription.sdp
                });

                if (!res.ok) throw new Error(`Twitch rejected (HTTP ${res.status})`);

                whipRes = res.headers.get('Location');

                await pc.setRemoteDescription({
                    type: 'answer',
                    sdp: await res.text()
                });

                startTime = Date.now();

                timerIv = setInterval(() => {
                    const s = Math.floor((Date.now() - startTime) / 1000);
                    $('sb-timer').textContent = [
                        Math.floor(s / 3600),
                        Math.floor(s % 3600 / 60),
                        s % 60
                    ].map(n => String(n).padStart(2, '0')).join(':');
                }, 1000);

                $('bDot').classList.add('live');
                $('livebadge').style.display = '';
                $('sbTimerSeg').style.display = 'flex';
                $('goLiveBtn').style.display = 'none';
                $('stopBtn').style.display = '';
                setStatus('live', '🔴 Live on Twitch');
            } catch (err) {
                console.error(err);
                try { pc?.close(); } catch (_) {}
                pc = null;
                $('goLiveBtn').disabled = false;
                setStatus('', err.message || 'Connection failed');
            }
        };

        async function stopAll() {
            clearInterval(timerIv);

            if (whipRes) {
                try {
                    await fetch(whipRes, { method: 'DELETE' });
                } catch {}
            }

            try { pc?.close(); } catch (_) {}
            pc = null;
            whipRes = null;

            [displayStream, micStream].forEach(s => {
                s?.getTracks().forEach(t => t.stop());
            });

            displayStream = micStream = null;
            disconnectAllAudio();

            Object.values(meterStops).forEach(fn => fn());
            meterStops = {};

            vidEl.srcObject = null;

            Object.keys(camStreams).forEach(k => stopCamera(parseInt(k)));

            $('bDot').classList.remove('live');
            $('livebadge').style.display = 'none';
            $('sbTimerSeg').style.display = 'none';
            $('sb-timer').textContent = '00:00:00';
            $('goLiveBtn').style.display = '';
            $('goLiveBtn').disabled = true;
            $('stopBtn').style.display = 'none';
            $('shareBtn').disabled = false;
            $('deskMeter').style.width = '0%';
            $('micMeter').style.width = '0%';
            $('pbadge').textContent = 'No source';
            setStatus('', 'Idle');
            renderSources();
        }

        $('stopBtn').onclick = stopAll;

        function typeVal() {
            return document.querySelector('input[name=ovType]:checked').value;
        }

        $('ovOpacity').oninput = () => {
            $('opPct').textContent = $('ovOpacity').value;
        };

        document.querySelectorAll('input[name=ovType]').forEach(r => {
            r.onchange = () => {
                const t = typeVal();
                $('txtFields').style.display = t === 'text' ? '' : 'none';
                $('imgFields').style.display = t === 'image' ? '' : 'none';
                $('camFields').style.display = t === 'camera' ? '' : 'none';
                if (t === 'camera') populateCamSelect();
            };
        });

        function resetModal() {
            document.querySelector('input[name=ovType][value=text]').checked = true;
            $('txtFields').style.display = '';
            $('imgFields').style.display = 'none';
            $('camFields').style.display = 'none';
            $('ovText').value = '';
            $('ovSize').value = '36';
            $('ovColor').value = '#ffffff';
            $('ovBgOn').checked = false;
            $('ovBgColor').value = '#000000';
            $('ovFile').value = '';
            $('ovImgW').value = '25';
            $('ovCamW').value = '18';
            $('ovCamMirror').checked = true;
            $('ovX').value = '5';
            $('ovY').value = '90';
            $('ovOpacity').value = '100';
            $('opPct').textContent = '100';
        }

        function openAdd() {
            editOvId = null;
            $('modalTitle').textContent = 'Add Source';
            $('modalSave').textContent = 'Add';
            resetModal();
            $('modal-wrap').classList.remove('hidden');
        }

        function openEdit(ov) {
            editOvId = ov.id;
            $('modalTitle').textContent = 'Edit Source';
            $('modalSave').textContent = 'Save';
            resetModal();

            document.querySelector(`input[name=ovType][value=${ov.type}]`).checked = true;
            $('txtFields').style.display = ov.type === 'text' ? '' : 'none';
            $('imgFields').style.display = ov.type === 'image' ? '' : 'none';
            $('camFields').style.display = ov.type === 'camera' ? '' : 'none';

            if (ov.type === 'text') {
                $('ovText').value = ov.text || '';
                $('ovSize').value = ov.fontSize || 36;
                $('ovColor').value = ov.color || '#ffffff';
                $('ovBgOn').checked = !!ov.bgOn;
                $('ovBgColor').value = ov.bgColor || '#000000';
            } else if (ov.type === 'image') {
                $('ovImgW').value = ov.widthPct || 25;
            } else if (ov.type === 'camera') {
                $('ovCamW').value = ov.widthPct || 18;
                $('ovCamMirror').checked = !!ov.mirror;
                populateCamSelect();
            }

            $('ovX').value = Math.round(ov.xPct || 0);
            $('ovY').value = Math.round(ov.yPct || 0);

            const op = Math.round((ov.opacity || 1) * 100);
            $('ovOpacity').value = op;
            $('opPct').textContent = op;

            $('modal-wrap').classList.remove('hidden');
        }

        function closeModal() {
            $('modal-wrap').classList.add('hidden');
        }

        $('modalX').onclick = $('modalCancel').onclick = closeModal;
        $('addSrcBtn').onclick = openAdd;

        function loadImg(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();

                r.onload = e => {
                    const i = new Image();
                    i.onload = () => resolve(i);
                    i.onerror = reject;
                    i.src = e.target.result;
                };

                r.onerror = reject;
                r.readAsDataURL(file);
            });
        }

        $('modalSave').onclick = async () => {
            const type = typeVal();
            const xPct = parseFloat($('ovX').value) || 0;
            const yPct = parseFloat($('ovY').value) || 0;
            const opacity = (parseInt($('ovOpacity').value) || 100) / 100;

            if (editOvId) {
                const ov = overlays[activeId].find(o => o.id === editOvId);

                if (ov) {
                    ov.xPct = xPct;
                    ov.yPct = yPct;
                    ov.opacity = opacity;

                    if (type === 'text') {
                        if (ov.type === 'camera') stopCamera(ov.id);
                        ov.type = 'text';
                        ov.text = $('ovText').value || 'Text';
                        ov.fontSize = parseInt($('ovSize').value) || 36;
                        ov.color = $('ovColor').value;
                        ov.bgOn = $('ovBgOn').checked;
                        ov.bgColor = $('ovBgColor').value;
                        ov.label = ov.text.slice(0, 20);
                    } else if (type === 'image') {
                        if (ov.type === 'camera') stopCamera(ov.id);
                        ov.type = 'image';
                        ov.widthPct = parseFloat($('ovImgW').value) || 25;

                        const f = $('ovFile').files[0];
                        if (f) {
                            ov.img = await loadImg(f);
                            ov.label = f.name.slice(0, 20);
                        } else {
                            ov.label = ov.label || 'Image';
                        }
                    } else if (type === 'camera') {
                        ov.type = 'camera';
                        ov.widthPct = parseFloat($('ovCamW').value) || 18;
                        ov.mirror = $('ovCamMirror').checked;
                        ov.label = 'Face Cam';

                        const devId = $('ovCamDev').value || '';

                        if (!camStreams[ov.id]) {
                            const stream = await startCamera(devId);

                            if (stream) {
                                camStreams[ov.id] = stream;
                                const v = document.createElement('video');
                                v.autoplay = true;
                                v.muted = true;
                                v.playsInline = true;
                                v.srcObject = stream;
                                await v.play().catch(() => {});
                                ov.vidEl = v;
                            } else {
                                alert('Could not access camera.');
                                return;
                            }
                        }
                    }
                }
            } else {
                const id = nextOId++;
                const ov = {
                    id,
                    type,
                    xPct,
                    yPct,
                    opacity,
                    visible: true
                };

                if (type === 'text') {
                    ov.text = $('ovText').value || 'Text';
                    ov.fontSize = parseInt($('ovSize').value) || 36;
                    ov.color = $('ovColor').value;
                    ov.bgOn = $('ovBgOn').checked;
                    ov.bgColor = $('ovBgColor').value;
                    ov.label = ov.text.slice(0, 20);
                } else if (type === 'image') {
                    const f = $('ovFile').files[0];

                    if (!f) {
                        alert('Select an image file first.');
                        return;
                    }

                    ov.img = await loadImg(f);
                    ov.widthPct = parseFloat($('ovImgW').value) || 25;
                    ov.label = f.name.slice(0, 20);
                } else if (type === 'camera') {
                    const devId = $('ovCamDev').value || '';
                    const stream = await startCamera(devId);

                    if (!stream) {
                        alert('Could not access camera.');
                        return;
                    }

                    camStreams[id] = stream;

                    const v = document.createElement('video');
                    v.autoplay = true;
                    v.muted = true;
                    v.playsInline = true;
                    v.srcObject = stream;
                    await v.play().catch(() => {});

                    ov.vidEl = v;
                    ov.widthPct = parseFloat($('ovCamW').value) || 18;
                    ov.mirror = $('ovCamMirror').checked;
                    ov.label = 'Face Cam';
                }

                overlays[activeId].push(ov);
            }

            renderSources();
            closeModal();
        };

        renderScenes();
        renderSounds();
        renderSources();
        setStatus('', 'Idle');

        window.addEventListener('beforeunload', () => {
            try { pc?.close(); } catch (_) {}
            [displayStream, micStream].forEach(s => s?.getTracks().forEach(t => t.stop()));
            Object.values(camStreams).forEach(s => s?.getTracks().forEach(t => t.stop()));
        });
    </script>
</body>
</html>
