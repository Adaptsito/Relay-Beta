        // ── Twitch API ──
        function initTwitch() {
            if (settings.twitchChannel) {
                fetchTwitchStream();
                if (twitchViewerInterval) clearInterval(twitchViewerInterval);
                twitchViewerInterval = setInterval(fetchTwitchStream, 15000);
            }
        }

        async function twitchApiRequest(endpoint, method = 'GET', body = null) {
            const c = settings.twitchClientId,
                o = settings.twitchOAuth;
            if (!c || !o) throw new Error('Missing credentials');
            const headers = { 'Client-ID': c, 'Authorization': `Bearer ${o}` };
            if (body) headers['Content-Type'] = 'application/json';
            const res = await fetch(`https://api.twitch.tv/helix/${endpoint}`, { method, headers, body: body ? JSON
                    .stringify(body) : undefined });
            if (!res.ok) throw new Error(`API error ${res.status}`);
            return res.json();
        }

        async function fetchTwitchStream() {
            const ch = settings.twitchChannel;
            if (!ch) return;
            try {
                const u = await twitchApiRequest(`users?login=${ch}`);
                if (!u.data || !u.data.length) return;
                twitchUserId = u.data[0].id;
                const s = await twitchApiRequest(`streams?user_id=${twitchUserId}`);
                if (s.data && s.data.length) {
                    const st = s.data[0];
                    const viewerCount = st.viewer_count || 0;
                    $('viewer-indicator').textContent = viewerCount;
                    $('viewerSeg').style.display = 'flex';
                } else {
                    $('viewerSeg').style.display = 'none';
                }
            } catch (e) { console.warn('Twitch API error:', e); }
        }

        // ── Undo/Redo (simplified) ──
        function pushHistory(action, data) {
            history = history.slice(0, historyIndex + 1);
            history.push({ action, data: JSON.parse(JSON.stringify(data)) });
            if (history.length > MAX_HISTORY) history.shift();
            historyIndex = history.length - 1;
            updateUndoButtons();
        }

        function undo() { if (historyIndex <= 0) return;
            historyIndex--;
            restoreHistory(history[historyIndex]);
            updateUndoButtons();
            toast('Undo.'); }

        function redo() { if (historyIndex >= history.length - 1) return;
            historyIndex++;
            restoreHistory(history[historyIndex]);
            updateUndoButtons();
            toast('Redo.'); }

        function restoreHistory(item) { if (item.action === 'overlay_state') { overlays[activeId] = item.data;
                renderSources(); } }

        function updateUndoButtons() { /* simplified */ }

        // ── Export/Import ──
        $('exportBtn').onclick = () => {
            const data = { version: 2, scenes: scenes.map(s => ({ id: s.id, name: s.name, bgColor: s.bgColor })),
                overlays, sounds: sounds.map(s => ({ id: s.id, name: s.name, volume: s.volume, folder: s.folder,
                    hotkey: s.hotkey })), settings };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'relay-project.json';
            a.click();
            URL.revokeObjectURL(url);
            toast('Project exported.');
        };
        $('importBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = async () => {
                const f = input.files[0];
                if (!f) return;
                try {
                    const text = await f.text(),
                        data = JSON.parse(text);
                    if (data.scenes && data.overlays) {
                        scenes = data.scenes;
                        overlays = data.overlays;
                        let maxS = 0,
                            maxO = 0;
                        scenes.forEach(s => maxS = Math.max(maxS, s.id));
                        Object.values(overlays).forEach(arr => arr.forEach(o => maxO = Math.max(maxO, o.id)));
                        nextSId = maxS + 1;
                        nextOId = maxO + 1;
                        if (data.sounds) { sounds = data.sounds.map(s => ({ ...s, file: null }));
                            soundKeyMap = {};
                            sounds.forEach(s => { if (s.hotkey) soundKeyMap[s.hotkey] = s.id; }); }
                        if (data.settings) Object.assign(settings, data.settings);
                        if (scenes.length) activeId = scenes[0].id;
                        applySettings();
                        renderScenes();
                        renderSources();
                        renderSounds();
                        initTwitch();
                        toast('Project imported.');
                    } else toast('Invalid project file.');
                } catch (e) { toast('Import failed: ' + e.message); }
            };
            input.click();
        };

        // ── Modal ──
        function typeVal() { return document.querySelector('input[name=ovType]:checked').value; }
        $('ovOpacity').oninput = () => $('opPct').textContent = $('ovOpacity').value;
        document.querySelectorAll('input[name=ovType]').forEach(r => r.onchange = () => {
            const t = typeVal();
            $('txtFields').style.display = (t === 'text' || t === 'ticker' || t === 'clock' || t === 'countdown') ?
                '' : 'none';
            $('imgFields').style.display = t === 'image' ? '' : 'none';
            $('camFields').style.display = t === 'camera' ? '' : 'none';
            $('tickerSpeedRow').style.display = t === 'ticker' ? '' : 'none';
            $('countdownRow').style.display = t === 'countdown' ? '' : 'none';
            if (t === 'camera') populateCamSelect();
        });

        function resetModal() {
            document.querySelector('input[name=ovType][value=text]').checked = true;
            $('txtFields').style.display = '';
            $('imgFields').style.display = 'none';
            $('camFields').style.display = 'none';
            $('tickerSpeedRow').style.display = 'none';
            $('countdownRow').style.display = 'none';
            $('ovText').value = '';
            $('ovSize').value = '36';
            $('ovColor').value = '#ffffff';
            $('ovShadowColor').value = '#000000';
            $('ovShadowBlur').value = '4';
            $('ovStrokeColor').value = '#000000';
            $('ovStrokeWidth').value = '0';
            $('ovFontFamily').value = '-apple-system, sans-serif';
            $('ovFile').value = '';
            $('ovImgW').value = '25';
            $('ovCamW').value = '18';
            $('ovCamMirror').checked = true;
            $('ovX').value = '50';
            $('ovY').value = '50';
            $('ovRotate').value = '0';
            $('ovOpacity').value = '100';
            $('opPct').textContent = '100';
            $('ovLocked').checked = false;
            $('ovTickerSpeed').value = '2';
            $('ovCountdownTarget').value = '60';
        }

        function openAdd() {
            editOvId = null;
            $('modalTitle').textContent = 'Add Source';
            $('modalSave').textContent = 'Add';
            resetModal();
            $('modal-wrap').classList.add('show');
            if (typeVal() === 'camera') populateCamSelect();
        }

        function openEdit(ov) {
            editOvId = ov.id;
            $('modalTitle').textContent = 'Edit Source';
            $('modalSave').textContent = 'Save';
            resetModal();
            document.querySelector(`input[name=ovType][value=${ov.type}]`).checked = true;
            $('txtFields').style.display = (ov.type === 'text' || ov.type === 'ticker' || ov.type === 'clock' || ov
                .type === 'countdown') ? '' : 'none';
            $('imgFields').style.display = ov.type === 'image' ? '' : 'none';
            $('camFields').style.display = ov.type === 'camera' ? '' : 'none';
            $('tickerSpeedRow').style.display = ov.type === 'ticker' ? '' : 'none';
            $('countdownRow').style.display = ov.type === 'countdown' ? '' : 'none';
            if (ov.type === 'text' || ov.type === 'ticker' || ov.type === 'clock' || ov.type === 'countdown') {
                $('ovText').value = ov.text || '';
                $('ovSize').value = ov.fontSize || 36;
                $('ovColor').value = ov.color || '#ffffff';
                $('ovShadowColor').value = ov.shadowColor || '#000000';
                $('ovShadowBlur').value = ov.shadowBlur || 4;
                $('ovStrokeColor').value = ov.strokeColor || '#000000';
                $('ovStrokeWidth').value = ov.strokeWidth || 0;
                $('ovFontFamily').value = ov.fontFamily || '-apple-system, sans-serif';
                if (ov.type === 'ticker') $('ovTickerSpeed').value = ov.tickerSpeed || 2;
                if (ov.type === 'countdown') $('ovCountdownTarget').value = ov.countdownTarget || 60;
            } else if (ov.type === 'image') { $('ovImgW').value = ov.widthPct || 25; } else if (ov.type === 'camera') {
                $('ovCamW').value = ov.widthPct || 18;
                $('ovCamMirror').checked = !!ov.mirror;
                populateCamSelect();
            }
            $('ovX').value = Math.round(ov.xPct || 0);
            $('ovY').value = Math.round(ov.yPct || 0);
            $('ovRotate').value = ov.rotation || 0;
            const op = Math.round((ov.opacity || 1) * 100);
            $('ovOpacity').value = op;
            $('opPct').textContent = op;
            $('ovLocked').checked = !!ov.locked;
            $('modal-wrap').classList.add('show');
        }

        function closeModal() { $('modal-wrap').classList.remove('show'); }
        $('modalX').onclick = $('modalCancel').onclick = closeModal;
        $('addSrcBtn').onclick = openAdd;

        function loadImg(file) {
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = e => { const i = new Image();
                    i.onload = () => res(i);
                    i.onerror = rej;
                    i.src = e.target.result; };
                r.onerror = rej;
                r.readAsDataURL(file);
            });
        }

        $('modalSave').onclick = async () => {
            const type = typeVal(),
                xPct = parseFloat($('ovX').value) || 0,
                yPct = parseFloat($('ovY').value) || 0;
            const opacity = (parseInt($('ovOpacity').value) || 100) / 100,
                rotation = parseFloat($('ovRotate').value) || 0,
                locked = $('ovLocked').checked;
            if (editOvId) {
                const ov = overlays[activeId].find(o => o.id === editOvId);
                if (ov) {
                    ov.xPct = xPct;
                    ov.yPct = yPct;
                    ov.opacity = opacity;
                    ov.rotation = rotation;
                    ov.locked = locked;
                    if (type === 'text' || type === 'ticker' || type === 'clock' || type === 'countdown') {
                        ov.type = type;
                        ov.text = $('ovText').value || 'Text';
                        ov.fontSize = parseInt($('ovSize').value) || 36;
                        ov.color = $('ovColor').value;
                        ov.shadowColor = $('ovShadowColor').value;
                        ov.shadowBlur = parseInt($('ovShadowBlur').value) || 0;
                        ov.strokeColor = $('ovStrokeColor').value;
                        ov.strokeWidth = parseInt($('ovStrokeWidth').value) || 0;
                        ov.fontFamily = $('ovFontFamily').value;
                        ov.label = ov.text.slice(0, 20);
                        if (type === 'ticker') ov.tickerSpeed = parseFloat($('ovTickerSpeed').value) || 2;
                        if (type === 'countdown') {
                            ov.countdownTarget = parseInt($('ovCountdownTarget').value) || 60;
                            if (countdownTimers[ov.id]) clearInterval(countdownTimers[ov.id].interval);
                            const target = Date.now() + ov.countdownTarget * 1000;
                            countdownTimers[ov.id] = { targetTime: target, interval: setInterval(() => { if (Date
                                        .now() >= target) { clearInterval(countdownTimers[ov.id].interval);
                                        delete countdownTimers[ov.id]; } }, 500) };
                        }
                    } else if (type === 'image') {
                        ov.type = 'image';
                        ov.widthPct = parseFloat($('ovImgW').value) || 25;
                        const f = $('ovFile').files[0];
                        if (f) ov.img = await loadImg(f);
                        ov.label = f ? f.name.slice(0, 20) : 'Image';
                    } else if (type === 'camera') {
                        ov.type = 'camera';
                        ov.widthPct = parseFloat($('ovCamW').value) || 18;
                        ov.mirror = $('ovCamMirror').checked;
                        ov.label = 'Face Cam';
                        const devId = $('ovCamDev').value || '';
                        if (!camStreams[ov.id]) {
                            const stream = await startCamera(devId);
                            if (stream) {
                                camStreams[ov.id] = stream;
                                const v = document.createElement('video');
                                v.autoplay = true;
                                v.muted = true;
                                v.playsInline = true;
                                v.srcObject = stream;
                                await v.play().catch(() => {});
                                ov.vidEl = v;
                            } else { toast('Camera access failed.'); return; }
                        }
                    }
                    pushHistory('overlay_state', overlays[activeId]);
                    toast('Overlay updated.');
                }
            } else {
                const id = nextOId++,
                    ov = { id, type, xPct, yPct, opacity, visible: true, rotation, locked };
                if (type === 'text' || type === 'ticker' || type === 'clock' || type === 'countdown') {
                    ov.text = $('ovText').value || 'Text';
                    ov.fontSize = parseInt($('ovSize').value) || 36;
                    ov.color = $('ovColor').value;
                    ov.shadowColor = $('ovShadowColor').value;
                    ov.shadowBlur = parseInt($('ovShadowBlur').value) || 0;
                    ov.strokeColor = $('ovStrokeColor').value;
                    ov.strokeWidth = parseInt($('ovStrokeWidth').value) || 0;
                    ov.fontFamily = $('ovFontFamily').value;
                    ov.label = ov.text.slice(0, 20);
                    if (type === 'ticker') ov.tickerSpeed = parseFloat($('ovTickerSpeed').value) || 2;
                    if (type === 'countdown') {
                        ov.countdownTarget = parseInt($('ovCountdownTarget').value) || 60;
                        const target = Date.now() + ov.countdownTarget * 1000;
                        countdownTimers[id] = { targetTime: target, interval: setInterval(() => { if (Date.now() >=
                                    target) { clearInterval(countdownTimers[id].interval);
                                    delete countdownTimers[id]; } }, 500) };
                    }
                } else if (type === 'image') {
                    const f = $('ovFile').files[0];
                    if (!f) { toast('Select an image.'); return; }
                    ov.img = await loadImg(f);
                    ov.widthPct = parseFloat($('ovImgW').value) || 25;
                    ov.label = f.name.slice(0, 20);
                } else if (type === 'camera') {
                    const devId = $('ovCamDev').value || '';
                    const stream = await startCamera(devId);
                    if (!stream) { toast('Camera access failed.'); return; }
                    camStreams[id] = stream;
                    const v = document.createElement('video');
                    v.autoplay = true;
                    v.muted = true;
                    v.playsInline = true;
                    v.srcObject = stream;
                    await v.play().catch(() => {});
                    ov.vidEl = v;
                    ov.widthPct = parseFloat($('ovCamW').value) || 18;
                    ov.mirror = $('ovCamMirror').checked;
                    ov.label = 'Face Cam';
                }
                overlays[activeId].push(ov);
                pushHistory('overlay_state', overlays[activeId]);
                toast('Overlay added.');
            }
            renderSources();
            closeModal();
        };

        // ── PiP preset ──
        function applyPiPPreset() {
            const camOv = { id: nextOId++, type: 'camera', xPct: 82, yPct: 88, opacity: 1, visible: true, widthPct: 18,
                mirror: false, label: 'Camera PiP', rotation: 0, locked: false };
            startCamera('').then(stream => {
                if (stream) {
                    const v = document.createElement('video');
                    v.autoplay = true;
                    v.muted = true;
                    v.playsInline = true;
                    v.srcObject = stream;
                    v.play().catch(() => {});
                    camOv.vidEl = v;
                    camStreams[camOv.id] = stream;
                    overlays[activeId].push(camOv);
                    pushHistory('overlay_state', overlays[activeId]);
                    renderSources();
                    toast('PiP layout added.');
                } else toast('Camera not available.');
            });
        }

        const pipBtn = document.createElement('span');
        pipBtn.textContent = 'PiP';
        pipBtn.className = 'addbtn';
        pipBtn.title = 'Add PiP layout';
        pipBtn.style.marginLeft = '6px';
        pipBtn.onclick = (e) => { e.stopPropagation();
            applyPiPPreset(); };
        $('addSrcBtn').parentNode.insertBefore(pipBtn, $('addSrcBtn').nextSibling);

        // ── Scene BG picker ──
        const bgBtn = document.createElement('span');
        bgBtn.textContent = 'BG';
        bgBtn.className = 'addbtn';
        bgBtn.title = 'Set scene background';
        bgBtn.onclick = (e) => {
            e.stopPropagation();
            const s = scenes.find(sc => sc.id === activeId);
            if (!s) return;
            const choice = confirm('OK for color, Cancel for image');
            if (choice) {
                const color = prompt('Background color (hex):', s.bgColor || '#111');
                if (color) { s.bgColor = color;
                    s.bgImage = null;
                    toast('Background updated.'); }
            } else {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = () => {
                    const f = input.files[0];
                    if (!f) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => { s.bgImage = img;
                            toast('Background image set.'); };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(f);
                };
                input.click();
            }
        };
        document.querySelector('#pScenes .dp-hd').appendChild(bgBtn);

        // ── Template scene ──
        $('addSceneBtn').onclick = () => {
            const name = prompt('Scene name:', 'Scene ' + nextSId);
            if (!name) return;
            const useTemplate = confirm('Add "Starting Soon" template?');
            addScene(name, useTemplate ? 'starting-soon' : null);
            toast('Scene added.');
        };

        // ── Boot ──
        loadSettings();
        initApp();
        console.log('Relay loaded — professional edition.');
    </script>
</body>
</html>
